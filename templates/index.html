<!DOCTYPE html>

<html>

<head>

    <title>Loan & Credit Prediction</title>

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .container {
            width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background: #e8f5e9;
            white-space: pre-line;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Loan & Credit Model</h1>

    <form method="POST">

        <label>Age</label>
        <input type="number" name="age" required>

        <label>Income</label>
        <input type="number" name="income" required>

        <label>Loan Amount</label>
        <input type="number" name="loan" required>

        <label>Credit Score</label>
        <input type="number" name="credit" required>

        <label>Employment Years</label>
        <input type="number" name="employment" required>

        <label>Existing Loans</label>
        <input type="number" name="existing" required>

        <button type="submit">
            Predict Loan
        </button>

    </form>


    {% if result %}

    <div class="result">

        <h3>Prediction Results</h3>

        {{ result }}

    </div>

    {% endif %}

</div>

</body>

</html>
